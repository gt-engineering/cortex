name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: cortex-${{ github.workflow }}-${{ github.ref }}
  # Cancelling a main run can lose an image when the following commit only
  # changes an unrelated package. Serialize main; cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  AUTH_API_IMAGE: ghcr.io/${{ github.repository_owner }}/cortex-auth-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/cortex-web

jobs:
  validate:
    name: Validate affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      auth_api: ${{ steps.affected.outputs.auth_api }}
      auth_e2e: ${{ steps.affected.outputs.auth_e2e }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - name: Check out repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect affected applications
        id: affected
        run: |
          set -euo pipefail
          affected_file="$RUNNER_TEMP/cortex-affected.json"
          bunx turbo ls --affected --output=json > "$affected_file"

          has_package() {
            jq -r --arg package "$1" \
              'any(.packages.items[]?; .name == $package)' "$affected_file"
          }

          echo "auth_api=$(has_package '@cortex/auth-api')" >> "$GITHUB_OUTPUT"
          echo "auth_e2e=$(has_package '@cortex/auth-api-e2e')" >> "$GITHUB_OUTPUT"
          echo "web=$(has_package '@cortex/web')" >> "$GITHUB_OUTPUT"

          jq -r '.packages.items[].name' "$affected_file"

      - name: Generate Prisma client
        if: steps.affected.outputs.auth_api == 'true' || steps.affected.outputs.auth_e2e == 'true'
        run: bun run db:generate

      - name: Lint, test, and build affected packages
        run: bunx turbo run lint test build e2e --affected

  build-auth-api:
    name: Build auth API image
    if: needs.validate.outputs.auth_api == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.AUTH_API_IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Cortex Auth API
            org.opencontainers.image.description=Cortex authentication API

      - name: Build and optionally publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/auth-api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=auth-api
          cache-to: type=gha,mode=max,scope=auth-api
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.AUTH_API_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-web:
    name: Build web image
    if: needs.validate.outputs.web == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Cortex Web
            org.opencontainers.image.description=Cortex web application

      - name: Build and optionally publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
